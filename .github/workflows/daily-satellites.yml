
name: Daily satellite catalog snapshots

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query CelesTrak and preserve snapshot
        run: python update_satellite_history.py
      - name: Commit updated historical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/satellite-history.json
          if ! git diff --staged --quiet; then
            git commit -m "data: daily CelesTrak catalog snapshot"
            git push
          fi
